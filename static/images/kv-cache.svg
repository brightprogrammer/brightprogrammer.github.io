<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 270" width="760" height="270">
<style>.dg text{font-family:var(--font-copy,Georgia,serif);fill:#111;font-size:19px}
.dg .c{text-anchor:middle;dominant-baseline:central}
.dg .t{font-size:24px;font-weight:700}
.dg .b{font-weight:700}
.dg .i{font-style:italic;fill:#333;font-size:17px}
.dg .sm{font-size:16px}
.dg .m{font-family:var(--font-mono,monospace);font-size:15px}
.dg .box{fill:#fff;stroke:#666;stroke-width:1}
.dg .off{fill:#fff;stroke:#aaa;stroke-width:1}
.dg .hi{fill:#eef5ff;stroke:#003399;stroke-width:1.2}
.dg .panel{fill:#fbfbfb;stroke:#999;stroke-width:1}
.dg .ln{stroke:#333;stroke-width:1.3;fill:none}
.dg .lh{stroke:#003399;stroke-width:1.6;fill:none}
.dg .cached{fill:#f2f2f2;stroke:#999;stroke-width:1}</style>
<rect width="760" height="270" fill="#fff"/>

<text class="b" x="20" y="65" dominant-baseline="central">without KV cache</text>
<rect class="hi" x="200" y="47" width="60" height="36"/><text class="c m" x="230" y="65">The</text>
<rect class="hi" x="268" y="47" width="60" height="36"/><text class="c m" x="298" y="65">cat</text>
<rect class="hi" x="336" y="47" width="60" height="36"/><text class="c m" x="366" y="65">sat</text>
<rect class="hi" x="404" y="47" width="60" height="36"/><text class="c m" x="434" y="65">on</text>
<text class="sm" x="490" y="56" dominant-baseline="central">every token computed again</text>
<text class="i" x="490" y="78" dominant-baseline="central">more work at every step</text>

<text class="b" x="20" y="170" dominant-baseline="central">with KV cache</text>
<rect x="190" y="132" width="214" height="62" fill="none" stroke="#999" stroke-dasharray="5 4"/>
<text class="m" x="196" y="122" dominant-baseline="central">KV cache</text>
<rect class="cached" x="200" y="152" width="60" height="36"/><text class="c m" x="230" y="170">The</text>
<rect class="cached" x="268" y="152" width="60" height="36"/><text class="c m" x="298" y="170">cat</text>
<rect class="cached" x="336" y="152" width="60" height="36"/><text class="c m" x="366" y="170">sat</text>
<rect class="hi" x="410" y="152" width="60" height="36"/><text class="c m" x="440" y="170">on</text>
<text class="sm" x="490" y="159" dominant-baseline="central">only the new token computed</text>
<text class="i" x="490" y="181" dominant-baseline="central">older keys &amp; values reused</text>

<rect class="hi" x="200" y="232" width="16" height="16"/><text class="sm" x="224" y="240" dominant-baseline="central">computed this step</text>
<rect class="cached" x="400" y="232" width="16" height="16"/><text class="sm" x="424" y="240" dominant-baseline="central">read from the cache</text>
</svg>
