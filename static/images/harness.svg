<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 345" width="760" height="345">
<style>.dg text{font-family:var(--font-copy,Georgia,serif);fill:#111;font-size:19px}
.dg .c{text-anchor:middle;dominant-baseline:central}
.dg .t{font-size:24px;font-weight:700}
.dg .b{font-weight:700}
.dg .i{font-style:italic;fill:#333;font-size:17px}
.dg .sm{font-size:16px}
.dg .m{font-family:var(--font-mono,monospace);font-size:15px}
.dg .box{fill:#fff;stroke:#666;stroke-width:1}
.dg .off{fill:#fff;stroke:#aaa;stroke-width:1}
.dg .hi{fill:#eef5ff;stroke:#003399;stroke-width:1.2}
.dg .panel{fill:#fbfbfb;stroke:#999;stroke-width:1}
.dg .ln{stroke:#333;stroke-width:1.3;fill:none}
.dg .lh{stroke:#003399;stroke-width:1.6;fill:none}
.dg .cached{fill:#f2f2f2;stroke:#999;stroke-width:1}</style>
<defs>
<marker id="hn-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="hn-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003399"/></marker>
</defs>
<rect width="760" height="345" fill="#fff"/>

<rect class="panel" x="135" y="15" width="610" height="315" style="stroke:#666"/>
<text class="t" x="155" y="44" dominant-baseline="central">Harness</text>

<rect class="box" x="155" y="65" width="570" height="40"/>
<text class="c" x="440" y="85">system prompt · personality · instructions</text>

<rect class="hi" x="185" y="140" width="130" height="90"/>
<text class="c t" x="250" y="185">LLM</text>

<rect class="box" x="520" y="130" width="190" height="110"/>
<text class="c b" x="615" y="152">tools</text>
<text class="m" x="550" y="180" dominant-baseline="central">web_search</text>
<text class="m" x="550" y="200" dominant-baseline="central">fetch_url</text>
<text class="m" x="550" y="220" dominant-baseline="central">shell, files, ...</text>

<path class="lh" d="M315,170 H518" marker-end="url(#hn-b)"/>
<text class="sm c" x="417" y="156">tool call</text>
<path class="ln" d="M520,205 H317" marker-end="url(#hn-a)"/>
<text class="sm c" x="417" y="221">result</text>

<rect class="box" x="155" y="265" width="570" height="45"/>
<text class="c" x="440" y="287">context window · memory · stop condition</text>

<rect class="box" x="15" y="145" width="90" height="80"/>
<text class="c t" x="60" y="185">you</text>
<path class="ln" d="M105,170 H183" marker-end="url(#hn-a)"/>
<text class="sm c" x="160" y="156">goal</text>
<path class="ln" d="M185,205 H107" marker-end="url(#hn-a)"/>
<text class="sm c" x="160" y="221">answer</text>
</svg>
