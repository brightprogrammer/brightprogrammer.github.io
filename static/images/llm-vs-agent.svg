<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 760 280" width="760" height="280">
<style>.dg text{font-family:var(--font-copy,Georgia,serif);fill:#111;font-size:19px}
.dg .c{text-anchor:middle;dominant-baseline:central}
.dg .t{font-size:24px;font-weight:700}
.dg .b{font-weight:700}
.dg .i{font-style:italic;fill:#333;font-size:17px}
.dg .sm{font-size:16px}
.dg .m{font-family:var(--font-mono,monospace);font-size:15px}
.dg .box{fill:#fff;stroke:#666;stroke-width:1}
.dg .off{fill:#fff;stroke:#aaa;stroke-width:1}
.dg .hi{fill:#eef5ff;stroke:#003399;stroke-width:1.2}
.dg .panel{fill:#fbfbfb;stroke:#999;stroke-width:1}
.dg .ln{stroke:#333;stroke-width:1.3;fill:none}
.dg .lh{stroke:#003399;stroke-width:1.6;fill:none}
.dg .cached{fill:#f2f2f2;stroke:#999;stroke-width:1}</style>
<defs>
<marker id="la-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="la-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003399"/></marker>
</defs>
<rect width="760" height="280" fill="#fff"/>

<rect class="panel" x="15" y="15" width="345" height="250"/>
<text class="t c" x="187" y="45">LLM</text>
<rect class="box" x="30" y="113" width="95" height="44"/>
<text class="c" x="77" y="135">prompt</text>
<path class="ln" d="M125,135 H148" marker-end="url(#la-a)"/>
<rect class="hi" x="150" y="113" width="80" height="44"/>
<text class="c b" x="190" y="135">LLM</text>
<path class="ln" d="M230,135 H253" marker-end="url(#la-a)"/>
<rect class="box" x="255" y="113" width="90" height="44"/>
<text class="c" x="300" y="135">text</text>
<text class="i c" x="187" y="235">one pass : text in, text out</text>

<rect class="panel" x="395" y="15" width="350" height="250"/>
<text class="t c" x="570" y="45">Agent</text>
<rect class="box" x="410" y="113" width="68" height="44"/>
<text class="c" x="444" y="135">goal</text>
<path class="ln" d="M478,135 H508" marker-end="url(#la-a)"/>
<rect class="hi" x="510" y="113" width="80" height="44"/>
<text class="c b" x="550" y="135">LLM</text>
<path class="lh" d="M590,135 H628" marker-end="url(#la-b)"/>
<text class="sm c" x="609" y="121">call</text>
<rect class="box" x="630" y="113" width="100" height="44"/>
<text class="c m" x="680" y="135">tools</text>
<path class="lh" d="M680,157 V190 H550 V159" marker-end="url(#la-b)"/>
<text class="sm c" x="615" y="205">result</text>
<path class="ln" d="M550,113 V80" marker-end="url(#la-a)"/>
<text class="sm" x="560" y="80" dominant-baseline="central">answer, when done</text>
<text class="i c" x="570" y="235">the same LLM, in a loop until the goal is met</text>
</svg>
