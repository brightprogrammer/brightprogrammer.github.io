title: ProjectBlue
subtitle: 'The Blue Place'
description: 'brightprogrammer`s blog'
keywords: ['reverse engineering', 'software', 'development', 'brightprogrammer']
author: Siddharth Mishra
language: en
timezone: 'Asia/Kolkata'
url: http://brightprogrammer.in
permalink: ':year/:month/:day/:title/'
permalink_defaults: null
pretty_urls:
    trailing_index: false
    trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render: null
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
    enable: true
    field: site
    exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
    enable: true
    line_number: true
    auto_detect: false
    tab_replace: ''
    wrap: true
    hljs: false
prismjs:
    enable: false
    preprocess: true
    line_number: true
    tab_replace: ''
index_generator:
    path: '/blog'
    per_page: 10
    order_by: '-date'
    pagination_dir: 'posts'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: ddd, Do MMMM, YYYY
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page
include: null
exclude: null
ignore: null
theme: icarus
deploy:
    type: ''
feed:
    enable: true
    type: atom
    path: atom.xml
    content_limit: 140
    content_limit_delim: ' '
    order_by: -date
    autodiscovery: true
