<aside class="sidebar sidebar-left" aria-label="Site sidebar">
  <section class="sidebar-box">
    <h2>Archive</h2>
    {{ $posts := where .Site.RegularPages "Section" "posts" }}
    {{ $groups := $posts.GroupByDate "2006" }}
    <ul class="sidebar-list sidebar-news sidebar-archive">
      {{ range sort $groups "Key" "desc" }}
        <li>
          <span class="sidebar-date">{{ .Key }}</span>
          <a href="{{ printf "/archives/%s/" .Key | relURL }}">{{ len .Pages }} posts</a>
        </li>
      {{ end }}
    </ul>
  </section>
</aside>
