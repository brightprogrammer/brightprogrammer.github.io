<footer class="site-footer">
  <div class="footer-badges">
    <a href="https://www.gnu.org/software/emacs/">
      <img class="badge-pixel" src="{{ "images/badges/emacs.gif" | relURL }}" alt="Emacs 88x31 button" width="88" height="31" />
    </a>
    <a href="https://helix-editor.com/">
      <img class="badge-pixel" src="{{ "images/badges/helix.gif" | relURL }}" alt="Helix 88x31 button" width="88" height="31" />
    </a>
    <a href="https://gohugo.io/">
      <img src="{{ "images/badges/hugo.svg" | relURL }}" alt="Built with Hugo 88x31 button" width="88" height="31" />
    </a>
    <a href="https://www.kernel.org/">
      <img class="badge-pixel" src="{{ "images/badges/linux_powered.gif" | relURL }}" alt="Powered by Linux 88x31 button" width="88" height="31" />
    </a>
    <a href="https://github.com/brightprogrammer">
      <img class="badge-pixel" src="{{ "images/badges/hackerpowered.gif" | relURL }}" alt="Hacker Powered 88x31 button" width="88" height="31" />
    </a>
    <a href="{{ with .OutputFormats.Get "RSS" }}{{ .RelPermalink }}{{ else }}{{ "/index.xml" | relURL }}{{ end }}">
      <img class="badge-pixel" src="{{ "images/badges/rss-button.gif" | relURL }}" alt="RSS feed 88x31 button" width="88" height="31" />
    </a>
    <img class="badge-pixel" src="{{ "images/badges/nocookie.gif" | relURL }}" alt="No Cookies 88x31 button" width="88" height="31" />
    <img class="badge-pixel" src="{{ "images/badges/internetprivacy.gif" | relURL }}" alt="Internet Privacy 88x31 button" width="88" height="31" />
  </div>
  {{ with .Site.Params.footnote }}
    <div class="footer-note">{{ . | safeHTML }}</div>
  {{ end }}
</footer>
