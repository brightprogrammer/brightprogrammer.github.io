<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}" data-theme="light" style="font-size: {{ .Site.Params.rootFontSize | default "100%" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="page">
      {{ partial "header.html" . }}
      <div class="layout-shell">
        {{ partial "sidebar-left.html" . }}
        <main id="content" class="site-main">
          {{ block "main" . }}{{ end }}
        </main>
        {{ partial "sidebar-right.html" . }}
      </div>
      {{ partial "footer.html" . }}
    </div>
    {{ partial "scripts.html" . }}
  </body>
</html>
