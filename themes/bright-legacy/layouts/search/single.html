{{ define "main" }}
  <section class="panel">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}
      <div class="content-body">
        {{ . }}
      </div>
    {{ end }}

    <form class="search-form" action="{{ .RelPermalink }}" method="get" onsubmit="return false;">
      <label for="search-input">Search</label>
      <input
        id="search-input"
        class="search-input"
        type="search"
        name="q"
        placeholder="Search posts, notes, and tags"
        aria-label="Search"
        data-index="{{ "lunr.json" | relURL }}"
      />
    </form>

    <p id="search-status" class="search-status">Type to search.</p>
    <div id="search-results" class="search-results"></div>
  </section>

  <script src="{{ "vendor/lunr/lunr.min.js" | relURL }}" defer></script>
  <script src="{{ "js/search.js" | relURL }}" defer></script>
{{ end }}
