<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}" data-theme="light" data-palette="{{ .Site.Params.palette | default "sage" }}" style="font-size: {{ .Site.Params.rootFontSize | default "100%" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .Site.Params.emphasisWithDots }}emphasis-dots{{ end }}">
    <canvas id="ambient-bg" class="ambient-bg" aria-hidden="true"></canvas>
    <div class="ambient-glass" aria-hidden="true"></div>
    <div class="ambient-grain" aria-hidden="true"></div>
    <div class="page">
      {{ partial "header.html" . }}
      <main class="main">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
    <div class="img-modal" id="img-modal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="img-modal__backdrop" data-img-close aria-hidden="true"></div>
      <div class="img-modal__content" role="document">
        <button class="img-modal__close" type="button" aria-label="Close image" data-img-close>×</button>
        <img class="img-modal__image" alt="" />
        <div class="img-modal__caption" aria-live="polite"></div>
      </div>
    </div>
    {{ partial "scripts.html" . }}
  </body>
</html>
